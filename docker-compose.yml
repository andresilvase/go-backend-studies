services:
  postgres:
    image: postgres:17
    container_name: transactions-lab
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - transactions_data:/var/lib/postgresql/data

volumes:
  transactions_data:
